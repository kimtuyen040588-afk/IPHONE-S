services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-4310}
      RELAY_CONSOLE_TOKEN: ${RELAY_CONSOLE_TOKEN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4310:4310"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phone_farm_relay
      POSTGRES_USER: phone_farm_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phone_farm_relay -d phone_farm_relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - phone-farm-relay-postgres:/var/lib/postgresql/data

volumes:
  phone-farm-relay-postgres:
